name: Ads spend test

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum (YYYY-MM-DD, leeg = gisteren)"
        required: false
        default: ""
      end:
        description: "Einddatum (YYYY-MM-DD, leeg = zelfde als start)"
        required: false
        default: ""
      force:
        description: "Al aanwezige dagen toch opnieuw ophalen (true/false)"
        required: false
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install requests cryptography
      - name: Ads spend ophalen
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID: ${{ secrets.ADS_PROFILE_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          START_INPUT: ${{ github.event.inputs.start }}
          END_INPUT: ${{ github.event.inputs.end }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$START_INPUT" ]; then ARGS="$ARGS --start $START_INPUT"; fi
          if [ -n "$END_INPUT" ]; then ARGS="$ARGS --end $END_INPUT"; fi
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Gebruikte argumenten: $ARGS"
          python fetch_ads_spend.py $ARGS
      - name: Resultaat tonen (ontsleuteld, alleen in deze CI-log)
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python3 -c "
          import crypto_utils
          try:
              with open('output/ads_spend_history.csv.enc', 'rb') as fh:
                  blob = fh.read()
              print(crypto_utils.decrypt_bytes(blob, crypto_utils.get_site_password()).decode('utf-8'))
          except FileNotFoundError:
              print('Nog geen ads_spend_history.csv.enc aangemaakt.')
          "
