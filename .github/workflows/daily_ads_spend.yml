name: Daily Ads spend

# Haalt dagelijks de advertentie-spend van gisteren op via de Amazon Ads API
# en commit output/ads_spend_history.csv naar de repo. Draait BEWUST los van
# "Daily Amazon update (SP-API)" -- dit rapporttype kan bij Amazon soms
# meerdere uren duren, en dat mag de rest van het dashboard niet blokkeren.
# De ads-cijfers van gisteren kunnen dus soms een paar uur later verschijnen
# dan de sales-cijfers van gisteren; dat is voor spend/ACOS geen probleem.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Startdatum voor terugvullen (YYYY-MM-DD, leeg = gisteren)"
        required: false
        default: ""
      end:
        description: "Einddatum voor terugvullen (YYYY-MM-DD, leeg = zelfde als start)"
        required: false
        default: ""
      force:
        description: "Al aanwezige dagen toch opnieuw ophalen en overschrijven (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # rapporten kunnen bij Amazon tot ~3,5 uur duren
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        run: pip install requests cryptography

      - name: Ads spend ophalen
        env:
          ADS_CLIENT_ID: ${{ secrets.ADS_CLIENT_ID }}
          ADS_CLIENT_SECRET: ${{ secrets.ADS_CLIENT_SECRET }}
          ADS_REFRESH_TOKEN: ${{ secrets.ADS_REFRESH_TOKEN }}
          ADS_PROFILE_ID: ${{ secrets.ADS_PROFILE_ID }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          START_INPUT: ${{ github.event.inputs.start }}
          END_INPUT: ${{ github.event.inputs.end }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
        run: |
          ARGS=""
          if [ -n "$START_INPUT" ]; then ARGS="$ARGS --start $START_INPUT"; fi
          if [ -n "$END_INPUT" ]; then ARGS="$ARGS --end $END_INPUT"; fi
          if [ "$FORCE_INPUT" = "true" ]; then ARGS="$ARGS --force"; fi
          echo "Gebruikte argumenten: $ARGS"
          python fetch_ads_spend.py $ARGS

      - name: Commit naar main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A output/
          if git diff --staged --quiet; then
            echo "Niets gewijzigd, geen commit nodig."
            exit 0
          fi
          git commit -m "Ads spend update $(date -u +%Y-%m-%d)"
          # Andere workflow (bv. "Daily Amazon update (SP-API)") kan gelijktijdig
          # gepusht hebben -- bij een afwijzing opnieuw pullen/rebasen en proberen.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "OK: gepusht."
              exit 0
            fi
            echo "Push mislukt (poging $i/5) -- waarschijnlijk pushte een andere workflow net. Opnieuw pullen en proberen..."
            git fetch origin main
            git rebase origin/main
            sleep 5
          done
          echo "FOUT: pushen bleef mislukken na 5 pogingen."
          exit 1
